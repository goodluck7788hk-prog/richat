[workspace]
resolver = "2"
members = [
    "benches",
    "cli",
    "client",
    "filter",
    "metrics",
    "plugin-agave",
    "proto",
    "richat",
    "shared",
]

[workspace.package]
authors = ["Lamports Dev", "Triton One"]
edition = "2024"
homepage = "https://lamports.dev"
repository = "https://github.com/lamports-dev/richat"
license = "Apache-2.0"
keywords = ["solana"]
publish = false

[workspace.dependencies]
affinity-linux = "1.0.1"
agave-geyser-plugin-interface = "4.3.0" # agave repo
agave-reserved-account-keys = "4.3.0" # agave repo
agave-votor-messages = "4.3.0" # agave repo
anyhow = "1.0.104"
arrayvec = "0.7.8"
base64 = "0.23.1"
bincode = "1.3.3"
bs58 = "0.5.1"
bytes = "1.12.1"
cargo-lock = "11.1.0"
clap = "4.6.7"
const-hex = "1.19.3"
criterion = "0.8.2"
crossbeam-queue = "0.3.13"
fastwebsockets = "0.10.0"
five8 = "1.0.0"
foldhash = "0.2.0"
futures = "0.3.33"
git-version = "0.3.9"
hostname = "0.4.2"
http-body-util = "0.1.5"
human-size = "0.4.4"
humantime-serde = "1.1.1"
hyper = "1.12.0"
hyper-util = "0.1.20"
indicatif = "0.18.6"
json5 = "1.3.1"
jsonrpc-core = "18.0.0"
jsonrpsee-types = "0.26.1"
kanal = "0.1.1"
log = "0.4.33"
maplit = "1.0.2"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
pin-project-lite = "0.2.17"
prost = "0.14.4"
prost-types = "0.14.4"
prost_011 = { package = "prost", version = "0.11.9" }
protoc-bin-vendored = "3.3.0"
quanta = "0.13.0"
quinn = "0.11.11"
rayon = "1.12.0"
rcgen = "0.14.10"
regex = "1.13.1"
richat-benches = { path = "benches", version = "1.0.0" }
richat-client = { path = "client", version = "9.0.0" }
richat-filter = { path = "filter", version = "9.0.0" }
richat-metrics = { path = "metrics", version = "1.0.1" }
richat-plugin-agave = { path = "plugin-agave", version = "9.0.0" }
richat-proto = { path = "proto", version = "9.0.0" }
richat-shared = { path = "shared", version = "9.0.0", default-features = false }
rocksdb = "0.24.0"
rustls = { version = "0.23.43", default-features = false }
rustls-native-certs = "0.8.5"
rustls-pemfile = "2.2.0"
serde = "1.0.229"
serde_json = "1.0.151"
serde_yaml = "0.9.34"
signal-hook = "0.4.4"
smallvec = "1.15.2"
solana-account = "4.5.0"
solana-account-decoder = "4.3.0" # agave repo
solana-bls-signatures = "3.4.0"
solana-clock = "3.2.0"
solana-commitment-config = "3.1.1"
solana-entry = "4.3.0" # agave repo
solana-hash = "4.6.0"
solana-logger = "3.0.0"
solana-message = "4.5.0"
solana-nohash-hasher = "0.2.1"
solana-pubkey = "4.3.0"
solana-pubsub-client = "4.3.0" # agave repo
solana-rpc-client-api = "4.3.0" # agave repo
solana-signature = "3.5.2"
solana-storage-proto = "4.3.0" # agave repo
solana-transaction = "4.2.0"
solana-transaction-context = "4.3.0" # agave repo
solana-transaction-error = "3.4.0"
solana-transaction-status = "4.3.0" # agave repo
solana-version = "4.3.0" # agave repo
spl-token-2022-interface = "3.1.0"
thiserror = "2.0.19"
tikv-jemallocator = { version = "0.6.0", features = ["unprefixed_malloc_on_supported_platforms"] }
tokio = "1.53.1"
tokio-rustls = "0.26.6"
tokio-tungstenite = "0.28.0"
tokio-util = "0.7.19"
toml = "1.1.2"
tonic = "0.14.6"
tonic-build = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
vergen = "9.0.2"
webpki-roots = "1.0.9"
yellowstone-grpc-proto = "14.0.1"
zstd = "0.13.3"

[workspace.lints.clippy]
clone_on_ref_ptr = "deny"
missing_const_for_fn = "deny"
trivially_copy_pass_by_ref = "deny"

[profile.release]
lto = true
codegen-units = 1
